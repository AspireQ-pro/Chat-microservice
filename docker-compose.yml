
services:
  chat-db:
    image: postgres:16-alpine
    container_name: chat-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:-chat_service}"
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-backend:
    build: ./Backend
    container_name: chat-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      BACKEND_URL: "${BACKEND_URL:?BACKEND_URL is required}"
      CHAT_FRONTEND_URL: "${CHAT_FRONTEND_URL:?CHAT_FRONTEND_URL is required}"
      CHAT_JWT_SECRET: "${CHAT_JWT_SECRET:?CHAT_JWT_SECRET is required}"
      MESSAGE_ENC_KEY: "${MESSAGE_ENC_KEY:?MESSAGE_ENC_KEY is required}"
      PROJECT_REGISTRATION_SECRET: "${PROJECT_REGISTRATION_SECRET:?PROJECT_REGISTRATION_SECRET is required}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      PORT: "5000"
      RBAC_BACKEND_URL: "${RBAC_BACKEND_URL:-http://3.110.56.109:8080}"
      AWS_REGION: "${AWS_REGION:-ap-south-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-}"
      MEDIA_CDN_DOMAIN: "${MEDIA_CDN_DOMAIN:-}"
      CLOUDFRONT_KEY_PAIR_ID: "${CLOUDFRONT_KEY_PAIR_ID:-}"
      CLOUDFRONT_PRIVATE_KEY_BASE64: "${CLOUDFRONT_PRIVATE_KEY_BASE64:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      S3_SERVER_SIDE_ENCRYPTION: "${S3_SERVER_SIDE_ENCRYPTION:-AES256}"
    volumes:
      - chat_uploads:/app/uploads
    depends_on:
      chat-db:
        condition: service_healthy
    restart: unless-stopped

  chat-frontend:
    build:
      context: ./Frontend
    container_name: chat-frontend
    ports:
      - "3001:80"
    depends_on:
      - chat-backend
    restart: unless-stopped

volumes:
  chat_db_data:
  chat_uploads:

